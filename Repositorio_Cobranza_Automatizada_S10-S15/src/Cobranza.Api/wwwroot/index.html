<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cobranza Automatizada - Panel interno</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <h1>Cobranza Automatizada</h1>
    <p class="sub">Embotelladora del Pacífico S.A. - uso interno</p>
    <p id="usuario" class="usuario"></p>
  </header>

  <main>
    <section id="consulta" aria-labelledby="t-consulta">
      <h2 id="t-consulta">Consulta de cliente (Ventas y Finanzas)</h2>
      <form id="form-rut">
        <label for="rut">RUT del cliente</label>
        <input id="rut" name="rut" placeholder="12345678-9" autocomplete="off" required>
        <button type="submit">Consultar</button>
      </form>
      <div id="resultado-cliente" class="tarjeta" hidden></div>
    </section>

    <section id="cartera" aria-labelledby="t-cartera" hidden>
      <h2 id="t-cartera">Indicadores de cartera (Finanzas y Tesorería)</h2>
      <div id="kpis" class="kpis"></div>
      <h3>Montos vencidos por tramo</h3>
      <table id="tramos"><thead><tr><th>Tramo</th><th>Monto</th></tr></thead><tbody></tbody></table>
    </section>

    <section id="operacion" aria-labelledby="t-operacion" hidden>
      <h2 id="t-operacion">Últimas sincronizaciones</h2>
      <table id="sinc">
        <thead><tr><th>Inicio (hora Chile)</th><th>Estado</th><th>Leídos</th><th>Actualizados</th><th>Pedidos liberados</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <script src="panel.js"></script>
</body>
</html>
